<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account · VoxText</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="border-b border-slate-800/80 backdrop-blur-md bg-slate-900/40 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2.5 rounded-xl shadow-lg shadow-indigo-600/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-violet-400 via-indigo-300 to-cyan-400">VoxText</h1>
                    <p class="text-xs text-slate-400">Speech recognition, private by default</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl shadow-2xl shadow-indigo-950/20 p-6 md:p-8">
            <h2 class="text-lg font-semibold text-slate-100">Create your account</h2>
            <p class="text-sm text-slate-400 mt-1 mb-6">Signing up keeps you signed in on this device for a week.</p>

            <form id="signupForm" novalidate class="space-y-4">
                <div class="space-y-1.5">
                    <label for="signupName" class="block text-xs font-medium uppercase tracking-wider text-slate-400">Name <span class="normal-case text-slate-600">(optional)</span></label>
                    <input id="signupName" name="full_name" type="text" autocomplete="name" maxlength="120"
                           class="w-full bg-slate-950/80 border border-slate-800 text-slate-100 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>

                <div class="space-y-1.5">
                    <label for="signupEmail" class="block text-xs font-medium uppercase tracking-wider text-slate-400">Email</label>
                    <input id="signupEmail" name="email" type="email" autocomplete="username" required
                           class="w-full bg-slate-950/80 border border-slate-800 text-slate-100 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>

                <div class="space-y-1.5">
                    <label for="signupPassword" class="block text-xs font-medium uppercase tracking-wider text-slate-400">Password</label>
                    <div class="relative">
                        <input id="signupPassword" name="password" type="password" autocomplete="new-password" required minlength="8"
                               class="w-full bg-slate-950/80 border border-slate-800 text-slate-100 text-sm rounded-xl px-4 py-3 pr-16 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        <button type="button" data-toggle-password="signupPassword"
                                class="absolute inset-y-0 right-0 px-4 text-xs font-medium text-slate-400 hover:text-slate-200">Show</button>
                    </div>
                    <p class="text-xs text-slate-500">At least 8 characters.</p>
                </div>

                <div class="space-y-1.5">
                    <label for="signupPasswordConfirm" class="block text-xs font-medium uppercase tracking-wider text-slate-400">Confirm password</label>
                    <input id="signupPasswordConfirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="8"
                           class="w-full bg-slate-950/80 border border-slate-800 text-slate-100 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>

                <div id="authError" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-xl text-sm"></div>

                <button id="authSubmit" type="submit"
                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-xl transition-colors shadow-lg shadow-indigo-950/40 flex items-center justify-center gap-2">
                    <span id="authSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    <span id="authSubmitLabel">Create account</span>
                </button>
            </form>

            <p class="text-sm text-slate-400 mt-6">
                Already registered?
                <a href="/login" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign in</a>
            </p>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
        <p>VoxText &bull; Passwords are stored as bcrypt hashes &mdash; never in plain text</p>
    </footer>

    <script src="/static/js/auth.js"></script>
</body>
</html>
